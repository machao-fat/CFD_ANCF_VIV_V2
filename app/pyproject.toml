[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "viv-case-generator"
version = "0.1.0"
description = "Offline CFD–preCICE–ANCF case builder"
requires-python = ">=3.10"
dependencies = ["PySide6>=6.6,<7", "PyYAML>=6,<7"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
viv-case-generator = "viv_app.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["viv_app*"]

[tool.setuptools.package-data]
viv_app = ["ui/*.qss"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

markers = ["smoke: fast offline model/XML/manifest/validation checks", "production_integration: read-only local qualified-lineage integration"]
